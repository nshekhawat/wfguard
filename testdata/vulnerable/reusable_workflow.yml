# Synthetic example of a reusable workflow that injects caller input directly
# into a run body. Any caller can make `tag` an arbitrary shell payload.
#
# Expected wfguard findings:
#   - severity: high, kind: reusable-workflow-input-injection

name: Tag a release (reusable)
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
      - run: |
          git tag "${{ inputs.tag }}"
          git push --tags
