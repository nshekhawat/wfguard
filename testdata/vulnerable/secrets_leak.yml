# Synthetic example of secrets exposure to an unpinned action.
#
# The publish step uses a third-party action by mutable tag (@v3) and hands
# it the NPM_TOKEN secret. If a malicious actor force-pushes the v3 tag onto
# a poisoned commit, every subsequent run silently leaks the secret.
#
# Expected wfguard findings:
#   - severity: high,     kind: secrets-exposure  (publish step)
#   - severity: medium,   kind: unpinned-action   (every unpinned uses)

name: Publish
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2

      - uses: third-party/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          dry_run: false
